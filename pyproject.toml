[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zoom-ics"
version = "0.1.0"
description = "Generate .ics calendar files with Zoom links from a human-readable .xlsx schedule"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vadim Melnik", email = "vmelnik@docsultant.com" }]
dependencies = [
    "click>=8.1",
    "openpyxl>=3.1",
    "icalendar>=5.0",
    "tzlocal>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
zoom-ics = "docsultant.zoom_ics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
